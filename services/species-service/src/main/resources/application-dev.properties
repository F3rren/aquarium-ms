# ========================================
# Dev Profile — species-service
# ========================================
# Activate with: spring.profiles.active=dev
# Nessun Kafka né inter-service call: solo verbosità

spring.jpa.show-sql=true

# Errori più verbosi per facilitare il debug
spring.web.error.include-message=always

# Health details visibili senza autenticazione in locale
management.endpoint.health.show-details=always

# Logging — più verboso in dev
logging.level.it.f3rren.aquarium=DEBUG
logging.level.org.springframework.web=DEBUG
