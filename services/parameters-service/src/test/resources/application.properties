# ========================================
# Test configuration — uses H2 in-memory DB
# ========================================

# H2 in PostgreSQL compatibility mode, creates the 'parameters' schema on startup
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS parameters
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=parameters

spring.flyway.enabled=false

# Kafka — fake broker so context loads without a running Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.auto-create=false
spring.kafka.listener.auto-startup=false

spring.application.name=parameters-service

# Actuator health — disabled in tests
management.health.db.enabled=false
management.health.circuitbreakers.enabled=false
