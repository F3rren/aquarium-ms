# ========================================
# Dev Profile — parameters-service
# ========================================
# Activate with: spring.profiles.active=dev

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Flyway disabilitato: Hibernate gestisce lo schema direttamente in locale
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Errori più verbosi per facilitare il debug
spring.web.error.include-message=always

# Health details visibili senza autenticazione in locale
management.endpoint.health.show-details=always

# Logging — più verboso in dev
logging.level.it.f3rren.aquarium=DEBUG
logging.level.org.springframework.web=DEBUG
