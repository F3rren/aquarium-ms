# ========================================
# Dev Profile — aquariums-service
# ========================================
# Activate with: spring.profiles.active=dev
# Use when running outside docker-compose (es. da IDE con DB locale)

# Override URL inter-servizio: localhost invece dei Docker DNS names
services.water-parameters.url=${WATER_PARAMETERS_URL:http://localhost:8085/api}
services.manual-parameters.url=${MANUAL_PARAMETERS_URL:http://localhost:8086/api}
services.target-parameters.url=${TARGET_PARAMETERS_URL:http://localhost:8087/api}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Flyway disabilitato: Hibernate gestisce lo schema direttamente in locale
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Errori più verbosi per facilitare il debug
spring.web.error.include-message=always

# Health details visibili senza autenticazione in locale
management.endpoint.health.show-details=always

# Logging — più verboso in dev
logging.level.it.f3rren.aquarium=DEBUG
logging.level.org.springframework.web=DEBUG
