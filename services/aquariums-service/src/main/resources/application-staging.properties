# ========================================
# Staging Profile — aquariums-service
# ========================================
# Activate with: SPRING_PROFILES_ACTIVE=staging sull'EC2
# I default URL in application.properties usano già i Docker DNS name,
# quindi non servono override di URL qui.

# Logging più verboso per facilitare il debug su staging
logging.level.it.f3rren.aquarium=DEBUG
spring.jpa.show-sql=true

# Health e errori visibili per agevolare la diagnostica su staging
management.endpoint.health.show-details=always
spring.web.error.include-message=always
