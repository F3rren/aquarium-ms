server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # ── OpenAPI / Swagger aggregation ──────────────────────────────────────
        - id: aquariums-service-openapi
          uri: ${AQUARIUMS_SERVICE_URL:http://aquariums-service:8081}
          predicates:
            - Path=/aquariums-service/v3/api-docs
          filters:
            - RewritePath=/aquariums-service/v3/api-docs, /v3/api-docs

        - id: inhabitants-service-openapi
          uri: ${INHABITANTS_SERVICE_URL:http://inhabitants-service:8082}
          predicates:
            - Path=/inhabitants-service/v3/api-docs
          filters:
            - RewritePath=/inhabitants-service/v3/api-docs, /v3/api-docs

        - id: species-service-openapi
          uri: ${SPECIES_SERVICE_URL:http://species-service:8083}
          predicates:
            - Path=/species-service/v3/api-docs
          filters:
            - RewritePath=/species-service/v3/api-docs, /v3/api-docs

        - id: maintenance-service-openapi
          uri: ${MAINTENANCE_SERVICE_URL:http://maintenance-service:8084}
          predicates:
            - Path=/maintenance-service/v3/api-docs
          filters:
            - RewritePath=/maintenance-service/v3/api-docs, /v3/api-docs

        - id: parameters-service-openapi
          uri: ${PARAMETERS_SERVICE_URL:http://parameters-service:8085}
          predicates:
            - Path=/parameters-service/v3/api-docs
          filters:
            - RewritePath=/parameters-service/v3/api-docs, /v3/api-docs

        - id: manual-parameters-service-openapi
          uri: ${MANUAL_PARAMETERS_SERVICE_URL:http://manual-parameters-service:8086}
          predicates:
            - Path=/manual-parameters-service/v3/api-docs
          filters:
            - RewritePath=/manual-parameters-service/v3/api-docs, /v3/api-docs

        - id: target-parameters-service-openapi
          uri: ${TARGET_PARAMETERS_SERVICE_URL:http://target-parameter-service:8087}
          predicates:
            - Path=/target-parameters-service/v3/api-docs
          filters:
            - RewritePath=/target-parameters-service/v3/api-docs, /v3/api-docs

        # ── Business routes ────────────────────────────────────────────────────

        # Maintenance - products (before aquariums to avoid catch-all)
        - id: maintenance-service-products
          uri: ${MAINTENANCE_SERVICE_URL:http://maintenance-service:8084}
          predicates:
            - Path=/products/**

        # Maintenance - tasks (before aquariums)
        - id: maintenance-service
          uri: ${MAINTENANCE_SERVICE_URL:http://maintenance-service:8084}
          predicates:
            - Path=/aquariums/*/tasks/**

        # Inhabitants (before aquariums)
        - id: inhabitants-service
          uri: ${INHABITANTS_SERVICE_URL:http://inhabitants-service:8082}
          predicates:
            - Path=/aquariums/*/inhabitants/**

        # Manual parameters — must be before water-parameters (more specific path)
        - id: manual-parameters-service
          uri: ${MANUAL_PARAMETERS_SERVICE_URL:http://manual-parameters-service:8086}
          predicates:
            - Path=/aquariums/*/parameters/manual/**

        # Water parameters (before aquariums)
        - id: water-parameters-service
          uri: ${PARAMETERS_SERVICE_URL:http://parameters-service:8085}
          predicates:
            - Path=/aquariums/*/parameters/**

        # Target parameters (before aquariums)
        - id: target-parameters-service
          uri: ${TARGET_PARAMETERS_SERVICE_URL:http://target-parameter-service:8087}
          predicates:
            - Path=/aquariums/*/settings/targets/**

        # Aquariums (catch-all, must be last)
        - id: aquariums-service
          uri: ${AQUARIUMS_SERVICE_URL:http://aquariums-service:8081}
          predicates:
            - Path=/aquariums/**

        # Species
        - id: species-service
          uri: ${SPECIES_SERVICE_URL:http://species-service:8083}
          predicates:
            - Path=/species/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Content-Type
              - Authorization
              - X-Requested-With
            allowCredentials: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    urls:
      - name: aquariums-service
        url: /aquariums-service/v3/api-docs
      - name: inhabitants-service
        url: /inhabitants-service/v3/api-docs
      - name: species-service
        url: /species-service/v3/api-docs
      - name: maintenance-service
        url: /maintenance-service/v3/api-docs
      - name: parameters-service
        url: /parameters-service/v3/api-docs
      - name: manual-parameters-service
        url: /manual-parameters-service/v3/api-docs
      - name: target-parameters-service
        url: /target-parameters-service/v3/api-docs
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  general-capacity: ${RATE_LIMIT_GENERAL_CAPACITY:120}
  general-refill-tokens: ${RATE_LIMIT_GENERAL_REFILL_TOKENS:2}
  general-refill-seconds: ${RATE_LIMIT_GENERAL_REFILL_SECONDS:1}
  write-capacity: ${RATE_LIMIT_WRITE_CAPACITY:20}
  write-refill-tokens: ${RATE_LIMIT_WRITE_REFILL_TOKENS:1}
  write-refill-seconds: ${RATE_LIMIT_WRITE_REFILL_SECONDS:3}
  cleanup-interval-ms: ${RATE_LIMIT_CLEANUP_INTERVAL_MS:300000}
  bucket-ttl-minutes: ${RATE_LIMIT_BUCKET_TTL_MINUTES:10}
  excluded-paths:
    - /actuator
    - /swagger-ui
    - /v3/api-docs

bot-protection:
  enabled: ${BOT_PROTECTION_ENABLED:true}
  blocked-user-agent-patterns:
    - "curl/"
    - "python-requests/"
    - "Go-http-client/"
    - "Java/"
    - "Apache-HttpClient"
    - "okhttp/"
    - "wget"
    - "libwww-perl"
    - "scrapy"
  excluded-paths:
    - /actuator
    - /swagger-ui
    - /v3/api-docs

# No default for jwt.secret: a missing JWT_SECRET must fail startup rather than sign tokens
# with a predictable key. Any length works - it's SHA-256-hashed into a valid HS256 key
# regardless (see JwtTokenProvider) - but treat it exactly like a database password: never
# commit a real value, only ever set it via the environment.
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  excluded-paths:
    - /actuator
    - /swagger-ui
    - /v3/api-docs
    - /auth/login

# Two fixed test identities for POST /auth/login - not a real user system, see AuthController.
auth:
  test-users:
    a:
      username: ${AUTH_USER_A_USERNAME:userA}
      password: ${AUTH_USER_A_PASSWORD}
    b:
      username: ${AUTH_USER_B_USERNAME:userB}
      password: ${AUTH_USER_B_PASSWORD}
  # Brute-force protection for /auth/login specifically - see LoginRateLimitFilter for why this
  # can't just be the rate-limit.* block above (GlobalFilters never see this endpoint).
  rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    capacity: ${AUTH_RATE_LIMIT_CAPACITY:5}
    refill-tokens: ${AUTH_RATE_LIMIT_REFILL_TOKENS:5}
    refill-seconds: ${AUTH_RATE_LIMIT_REFILL_SECONDS:60}
    cleanup-interval-ms: ${AUTH_RATE_LIMIT_CLEANUP_INTERVAL_MS:300000}
    bucket-ttl-minutes: ${AUTH_RATE_LIMIT_BUCKET_TTL_MINUTES:10}
