name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  test-aquariums-service:
    name: Test aquariums-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw test -B
        working-directory: services/aquariums-service

  test-inhabitants-service:
